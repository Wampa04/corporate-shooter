[workspace]
resolver = "3"
members = ["crates/predict", "crates/protocol", "crates/server", "crates/sim-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
# Bevy 0.19 verlangt 1.95. Gebaut wird mit der Fassung aus rust-toolchain.toml.
rust-version = "1.95"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
sim-core = { path = "crates/sim-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.32", features = ["serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Eigenes Profil fuer das WASM-Modul: dort zaehlt die Groesse, nicht die
# letzte Handbreit Rechenzeit. Als eigenes Profil und nicht in `release`,
# damit der Server davon unberuehrt bleibt - `panic = "abort"` waere dort eine
# Verhaltensaenderung, die niemand bestellt hat.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
