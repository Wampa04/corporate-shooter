[workspace]
resolver = "3"
members = ["crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.32", features = ["serde"] }
