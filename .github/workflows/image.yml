# Prueft den Quelltext und baut daraus das Container-Image, das in der GitHub
# Container Registry veroeffentlicht wird.
#
# Die Tests laufen vorgeschaltet: aus rotem Code entsteht erst gar kein Image.
#
# Veroeffentlicht wird nur vom Standardbranch und von Versions-Tags. Alle
# anderen Pushes und Pull Requests bauen das Image ebenfalls, behalten es aber
# fuer sich - so faellt ein kaputtes Dockerfile sofort auf, ohne die Registry
# mit Zwischenstaenden zu fuellen.

name: Container-Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Ein laufender Build fuer denselben Branch wird abgebrochen, sobald ein
# neuerer Commit kommt - veraltete Laeufe muessen nicht zu Ende laufen.
# Ausgenommen ist der Standardbranch: dort wird veroeffentlicht, und ein
# mittendrin abgebrochener Push in die Registry hinterlaesst halbe Zustaende.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

# Standardmaessig darf der Token nur lesen. Wer mehr braucht (das Image in die
# Registry schieben), sagt es in seinem Job selbst.
permissions:
  contents: read

jobs:
  lint:
    name: Format und Lints
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cargo-Verzeichnisse zwischenspeichern
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-clippy-

      - name: rustfmt
        run: cargo fmt --all --check

      # Warnungen sind Fehler: eine Warnung, die niemand behebt, gewoehnt nur
      # daran, Warnungen zu ueberlesen.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy fuer das WASM-Modul
        run: cargo clippy -p predict --target wasm32-unknown-unknown --locked -- -D warnings

      # Entwicklung und CI nehmen die Fassung aus rust-toolchain.toml, das
      # Dockerfile hat seine eigene. Laufen die beiden auseinander, baut das
      # Image mit einem anderen Compiler als der, mit dem getestet wurde.
      - name: Rust-Version in Dockerfile und rust-toolchain.toml gleich
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          docker=$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile)
          echo "rust-toolchain.toml: $toolchain, Dockerfile: $docker"
          if [ "$toolchain" != "$docker" ]; then
            echo "::error::Rust-Version weicht ab: rust-toolchain.toml $toolchain, Dockerfile $docker"
            exit 1
          fi

      - name: Pruefsummen der mitgelieferten Bibliotheken
        working-directory: client/vendor
        run: sha256sum --check --strict SHA256SUMS

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Der groesste Posten sind die Abhaengigkeiten: solange sich Cargo.lock
      # nicht aendert, muss Bevy nicht neu uebersetzt werden.
      - name: Cargo-Verzeichnisse zwischenspeichern
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `--locked` erzwingt, dass Cargo.lock zum Stand der Manifeste passt.
      # Ohne das koennte die CI stillschweigend andere Versionen benutzen als
      # der Arbeitsplatz - und als das Image, das gleich daraus entsteht.
      - name: Tests
        run: cargo test --workspace --locked

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Der ganze Sinn des WASM-Umwegs ist, dass es nur *eine* Bewegung gibt.
      # Laufen Rust und WebAssembly auseinander, faellt das sonst niemandem
      # auf: der Client stuende einfach an anderer Stelle als der Server ihn
      # sieht, und beide waeren fuer sich in Ordnung.
      - name: Gleichlauf Rust und WebAssembly
        run: scripts/lockstep.sh

  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Pruefwerkzeuge installieren
        run: npm ci

      # Die Typpruefung haette den verworfenen `z`-Parameter von `ribs()`
      # gefunden, der den Papierstapel der E-Mail wochenlang falsch
      # platzierte. ESLint findet unbenutzte Namen und Vertipper, Prettier
      # haelt die Form.
      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typpruefung
        run: npm run typecheck

      # Die Logik des Clients ohne Browser: Zusammenfuehren der Snapshots,
      # Rangliste, Zwischenbild-Ausgleich der Vorhersage, Grafikregler,
      # Laufzyklus.
      - name: Tests
        run: npm test

  image:
    name: Bauen, pruefen, veroeffentlichen
    needs: [lint, test, client]
    runs-on: ubuntu-latest

    # Reissleine: der Build braucht regulaer wenige Minuten. Bleibt er haengen,
    # soll er nicht stundenlang einen Runner belegen.
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    env:
      # Der Standardbranch wird zur Laufzeit ermittelt statt fest verdrahtet -
      # das Repository heisst seinen Hauptbranch vielleicht nicht "main".
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}

    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Namen und Tags bestimmen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          # Ohne diese Angaben leitet die Action Titel, Beschreibung und Lizenz
          # aus den Repository-Einstellungen ab - und ueberschreibt damit die
          # LABEL-Zeilen des Dockerfiles. Sind dort Beschreibung und Lizenz
          # nicht gesetzt, landen leere Beschriftungen im Image.
          labels: |
            org.opencontainers.image.title=Corporate Shooter
            org.opencontainers.image.description=Browser-Shooter im Grossraumbuero: autoritativer Rust-Server samt Browser-Client
            org.opencontainers.image.licenses=MIT

      # Erst lokal bauen und starten. Ein Image, das sich nicht starten laesst,
      # hat in der Registry nichts verloren.
      - name: Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: corporate-shooter:pruefling
          cache-from: type=gha
          # Geschrieben wird der Cache nur von Laeufen, die auch
          # veroeffentlichen. Alle anderen lesen ihn; so fuellen Zwischenstaende
          # von Branches und Pull Requests nicht den begrenzten Speicher.
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max' || '' }}

      - name: Image starten und ausliefern lassen
        run: |
          docker run --rm --detach --name pruefling \
            --publish 4200:4200 corporate-shooter:pruefling --no-mdns

          bereit=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4200/ \
                 | grep -q "Corporate Shooter"; then
              bereit=1
              break
            fi
            sleep 1
          done

          # Der Client muss vollstaendig im Image liegen, three.js eingeschlossen.
          if [ "$bereit" = 1 ]; then
            curl --fail --silent --output /dev/null \
              http://127.0.0.1:4200/vendor/three.module.min.js || bereit=0
          fi

          echo "::group::Serverprotokoll"
          docker logs pruefling 2>&1 || true
          echo "::endgroup::"
          docker rm --force pruefling > /dev/null

          if [ "$bereit" != 1 ]; then
            echo "::error::Das Image hat den Client nicht ausgeliefert."
            exit 1
          fi
          echo "Image laeuft und liefert den Client aus."

      - name: An der Registry anmelden
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Zweiter Durchlauf, der aus dem Cache des ersten schoepft und daher
      # nichts neu uebersetzt.
      - name: Image veroeffentlichen
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha

      # Die Tags kommen ueber die Umgebung ins Skript und nicht als
      # Ausdruck in den Text: was im Skript steht, wird als Shell gelesen.
      - name: Ergebnis zusammenfassen
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Container-Image"
            echo
            if [ "$PUBLISH" = "true" ]; then
              echo "Veroeffentlicht unter:"
              echo
              echo '```'
              echo "$TAGS"
              echo '```'
            else
              echo "Gebaut und gestartet, aber nicht veroeffentlicht."
              echo "Veroeffentlicht wird nur vom Standardbranch und von \`v*\`-Tags."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
