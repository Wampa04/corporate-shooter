# Prueft den Quelltext und baut daraus das Container-Image, das in der GitHub
# Container Registry veroeffentlicht wird.
#
# Die Tests laufen vorgeschaltet: aus rotem Code entsteht erst gar kein Image.
#
# Veroeffentlicht wird nur vom Standardbranch und von Versions-Tags. Alle
# anderen Pushes und Pull Requests bauen das Image ebenfalls, behalten es aber
# fuer sich - so faellt ein kaputtes Dockerfile sofort auf, ohne die Registry
# mit Zwischenstaenden zu fuellen.

name: Container-Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Ein laufender Build fuer denselben Branch wird abgebrochen, sobald ein
# neuerer Commit kommt - veraltete Laeufe muessen nicht zu Ende laufen.
# Ausgenommen ist der Standardbranch: dort wird veroeffentlicht, und ein
# mittendrin abgebrochener Push in die Registry hinterlaesst halbe Zustaende.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      # Der groesste Posten sind die Abhaengigkeiten: solange sich Cargo.lock
      # nicht aendert, muss Bevy nicht neu uebersetzt werden.
      - name: Cargo-Verzeichnisse zwischenspeichern
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `--locked` erzwingt, dass Cargo.lock zum Stand der Manifeste passt.
      # Ohne das koennte die CI stillschweigend andere Versionen benutzen als
      # der Arbeitsplatz - und als das Image, das gleich daraus entsteht.
      - name: Tests
        run: cargo test --workspace --locked

      # Der ganze Sinn des WASM-Umwegs ist, dass es nur *eine* Bewegung gibt.
      # Laufen Rust und WebAssembly auseinander, faellt das sonst niemandem
      # auf: der Client stuende einfach an anderer Stelle als der Server ihn
      # sieht, und beide waeren fuer sich in Ordnung.
      - name: Gleichlauf Rust und WebAssembly
        run: scripts/gleichlauf.sh

      # Vorhergesagt wird mit der Tickrate, gezeichnet mit der Bildrate. Ohne
      # Ausgleich dazwischen steht die Kamera drei von vier Bildern still und
      # springt dann - das liest sich als Ruckeln, obwohl die Vorhersage
      # stimmt.
      - name: Zwischenbild-Ausgleich der Vorhersage
        run: node scripts/zwischenbild.mjs

      # Ob ein Rechner den Schattenwurf traegt, entscheidet der Client selbst
      # anhand der gemessenen Bildzeit. Der Weg nach unten laesst sich im
      # Prueflauf noch beobachten, der Weg nach oben nicht: dafuer braeuchte es
      # eine Maschine, die erst langsam ist und dann schnell.
      - name: Regler fuer die Grafikstufe
        run: node scripts/grafikregler.mjs

  image:
    name: Bauen, pruefen, veroeffentlichen
    needs: test
    runs-on: ubuntu-latest

    # Reissleine: der Build braucht regulaer wenige Minuten. Bleibt er haengen,
    # soll er nicht stundenlang einen Runner belegen.
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    env:
      # Der Standardbranch wird zur Laufzeit ermittelt statt fest verdrahtet -
      # das Repository heisst seinen Hauptbranch vielleicht nicht "main".
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}

    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Namen und Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          # Ohne diese Angaben leitet die Action Titel, Beschreibung und Lizenz
          # aus den Repository-Einstellungen ab - und ueberschreibt damit die
          # LABEL-Zeilen des Dockerfiles. Sind dort Beschreibung und Lizenz
          # nicht gesetzt, landen leere Beschriftungen im Image.
          labels: |
            org.opencontainers.image.title=Corporate Shooter
            org.opencontainers.image.description=LAN-Shooter im Grossraumbuero: autoritativer Rust-Server samt Browser-Client
            org.opencontainers.image.licenses=MIT

      # Erst lokal bauen und starten. Ein Image, das sich nicht starten laesst,
      # hat in der Registry nichts verloren.
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: corporate-shooter:pruefling
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image starten und ausliefern lassen
        run: |
          docker run --rm --detach --name pruefling \
            --publish 4200:4200 corporate-shooter:pruefling --no-mdns

          bereit=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4200/ \
                 | grep -q "Corporate Shooter"; then
              bereit=1
              break
            fi
            sleep 1
          done

          # Der Client muss vollstaendig im Image liegen, three.js eingeschlossen.
          if [ "$bereit" = 1 ]; then
            curl --fail --silent --output /dev/null \
              http://127.0.0.1:4200/vendor/three.module.min.js || bereit=0
          fi

          echo "::group::Serverprotokoll"
          docker logs pruefling 2>&1 || true
          echo "::endgroup::"
          docker rm --force pruefling > /dev/null

          if [ "$bereit" != 1 ]; then
            echo "::error::Das Image hat den Client nicht ausgeliefert."
            exit 1
          fi
          echo "Image laeuft und liefert den Client aus."

      - name: An der Registry anmelden
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Zweiter Durchlauf, der aus dem Cache des ersten schoepft und daher
      # nichts neu uebersetzt.
      - name: Image veroeffentlichen
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha

      - name: Ergebnis zusammenfassen
        run: |
          {
            echo "### Container-Image"
            echo
            if [ "$PUBLISH" = "true" ]; then
              echo "Veroeffentlicht unter:"
              echo
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
            else
              echo "Gebaut und gestartet, aber nicht veroeffentlicht."
              echo "Veroeffentlicht wird nur vom Standardbranch und von \`v*\`-Tags."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
