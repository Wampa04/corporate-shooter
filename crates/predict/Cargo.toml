[package]
name = "predict"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Reine C-Schnittstelle: Zahlen und ein Bytepuffer. Dafuer genuegt das nackte
# `WebAssembly`-API des Browsers - `wasm-bindgen` waere ein Codegenerator und
# eine zusaetzliche Werkzeugkette im Docker-Bau, ohne dass hier etwas davon
# gebraucht wuerde.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
protocol = { workspace = true }
sim-core = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }
