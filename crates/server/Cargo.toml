[package]
name = "server"
description = "Autoritativer, headless laufender Spielserver fuer Corporate Shooter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
protocol = { workspace = true }
serde_json = { workspace = true }

sim-core = { workspace = true }
bevy = { version = "0.19", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header", "compression-gzip", "compression-br"] }
futures-util = "0.3"

crossbeam-channel = "0.5"
mdns-sd = "0.21"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process"] }
# Dieselbe Fassung, die axum mitbringt - sonst stehen zwei im Lockfile.
tokio-tungstenite = "0.29"

[lints]
workspace = true
