[package]
name = "server"
description = "Autoritativer, headless laufender Spielserver fuer Corporate Shooter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }

bevy = { version = "0.19", default-features = false }

tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
futures-util = "0.3"

crossbeam-channel = "0.5"
mdns-sd = "0.21"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process"] }
tokio-tungstenite = "0.30"
