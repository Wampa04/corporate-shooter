# Corporate Shooter betreiben.
#
#     cp .env.example .env      # optional, alles hat Vorgaben
#     docker compose up -d
#
# Vorgabe ist der Serverbetrieb: Port 4200 wird veroeffentlicht, mDNS ist aus.
# Wer stattdessen im eigenen LAN spielt, nimmt das Profil weiter unten.
#
# Fuer einen oeffentlich erreichbaren Server gehoert ein Reverse Proxy davor,
# der TLS beendet (Caddy, nginx, Traefik). Der Client waehlt von selbst `wss`,
# sobald die Seite ueber `https` ausgeliefert wird - eine Anpassung ist dafuer
# nicht noetig. Der Proxy muss lediglich das Upgrade auf WebSocket
# durchreichen.

name: corporate-shooter

services:
  server:
    image: ghcr.io/wampa04/corporate-shooter:latest

    # Damit baut `docker compose up --build` auch aus dem Arbeitsbaum, ohne
    # dass jemand erst ein Image aus der Registry holen muss.
    build:
      context: .

    # Serverbetrieb: gewoehnliches Bridge-Netz, ein veroeffentlichter Port.
    # Hinter einem Reverse Proxy stattdessen an 127.0.0.1 binden:
    #
    #   ports:
    #     - "127.0.0.1:4200:4200"
    ports:
      - "${CORPSHOOT_PORT:-4200}:${CORPSHOOT_PORT:-4200}"

    environment:
      # mDNS traegt nur im lokalen Netzsegment und wuerde hinter der Bridge
      # ohnehin die Containeradresse verkuenden.
      CORPSHOOT_NO_MDNS: "true"

    # Fehlt die Datei, startet der Container trotzdem - mit den Vorgaben des
    # Servers. Braucht Compose v2.24 oder neuer.
    env_file:
      - path: .env
        required: false

    restart: unless-stopped

    # Der Server haelt keinen Zustand, den es zu sichern gaebe. Laenger als
    # noetig auf ein sauberes Ende zu warten, bringt hier nichts.
    stop_grace_period: 5s

    # Prueft nur, ob der Port angenommen wird. Das Basisbild hat weder curl
    # noch wget; bash und dessen /dev/tcp sind bereits da und ersparen ein
    # zusaetzliches Paket im Laufzeitbild.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/${CORPSHOOT_PORT:-4200}"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Variante fuers eigene Netz: mDNS soll wirken, also Host-Netz.
  #
  #     docker compose --profile lan up -d server-lan
  #
  # Multicast kommt hinter dem NAT der Bridge nicht im LAN an, und die beim
  # Start ausgegebene Adresse waere die des Containers. Setzt Linux voraus;
  # unter Docker Desktop verhaelt sich das Host-Netz anders.
  server-lan:
    profiles: ["lan"]
    image: ghcr.io/wampa04/corporate-shooter:latest
    build:
      context: .
    network_mode: host
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    stop_grace_period: 5s
